name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n setup.sh
          for f in scripts/*.sh .githooks/pre-commit; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate skills
        run: ./scripts/validate.sh
